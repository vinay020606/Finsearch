version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: financial_rag_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: financial-rag-backend-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_rag_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: always

    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: financial_rag
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      CROSS_ENCODER_MODEL_NAME: cross-encoder/ms-marco-MiniLM-L-6-v2
    volumes:
      - ./app:/app/app
      - ./static:/app/static
    depends_on:

      postgres:
        condition: service_healthy

  gateway:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: financial_rag_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      PYTHON_SERVICE_URL: http://app:8000
    depends_on:
      - app

volumes:
  postgres_data:
